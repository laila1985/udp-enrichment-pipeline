spring:
  application:
    name: servuce-analytics-engine
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

udp:
  port: ${UDP_PORT:8080}
  buffer-size: 2048

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:deepseek-r1}

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  topic: ${KAFKA_TOPIC:analytics-events}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.servuce.analytics: INFO