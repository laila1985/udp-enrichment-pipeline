spring:
  application:
    name: udp-enrichment-pipeline
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

udp:
  port: ${UDP_PORT:514}
  buffer-size: 2048
  listener:
    mode: ${UDP_LISTENER_MODE:nio}

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:deepseek-r1}

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  topic: ${KAFKA_TOPIC:analytics-events}
  consumer-group: ${KAFKA_CONSUMER_GROUP:analytics-engine}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.service.analytics: INFO